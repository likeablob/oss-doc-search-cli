[project]
name = "oss-doc-search-cli"
version = "0.1.0"
description = "OSS documentation search with vector embeddings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.2",
    "huggingface-hub>=0.20.0",
    "onnxruntime>=1.25.1",
    "platformdirs>=4.3.6",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.14.5",
    "requests>=2.33.1",
    "tokenizers>=0.21.0",
    "tqdm>=4.67.3",
]

[project.scripts]
ossds = "oss_doc_search.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.11.0",
    "ty>=0.0.23",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oss_doc_search"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]